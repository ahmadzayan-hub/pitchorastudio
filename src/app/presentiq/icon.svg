<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pitchora">
  <defs>
    <linearGradient id="pq-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#1E2654"/>
      <stop offset="55%" stop-color="#161D44"/>
      <stop offset="100%" stop-color="#0A0E2A"/>
    </linearGradient>
    <linearGradient id="pq-aurora" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6366F1"/>
      <stop offset="45%"  stop-color="#8A6CF7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="pq-dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="pq-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Slide tile -->
  <rect width="512" height="512" rx="112" fill="url(#pq-tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="rgba(138,108,247,0.32)" stroke-width="4"/>

  <!-- Ghost slide content: headline + 3 bullets -->
  <rect x="112" y="152"  width="220" height="26"  rx="13" fill="rgba(199,203,246,0.28)"/>
  <rect x="112" y="212"  width="150" height="18"  rx="9"  fill="rgba(199,203,246,0.18)"/>
  <rect x="112" y="252"  width="182" height="18"  rx="9"  fill="rgba(199,203,246,0.18)"/>
  <rect x="112" y="292"  width="132" height="18"  rx="9"  fill="rgba(199,203,246,0.18)"/>

  <!-- Aurora arc rising from base to peak -->
  <path d="M 120 390 C 200 320, 280 280, 360 224 C 388 200, 408 176, 418 140"
        fill="none"
        stroke="url(#pq-aurora)"
        stroke-width="26"
        stroke-linecap="round"
        filter="url(#pq-glow)"/>

  <!-- Terminal dot at the peak -->
  <circle cx="418" cy="140" r="26" fill="url(#pq-dot)"/>
  <circle cx="418" cy="140" r="46" fill="none" stroke="rgba(192,132,252,0.4)" stroke-width="6"/>

  <!-- Anchor dot at the base -->
  <circle cx="120" cy="390" r="18" fill="#8A6CF7"/>
</svg>
