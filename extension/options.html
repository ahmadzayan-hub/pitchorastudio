<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Prompt ZAI@n — Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h2>Prompt ZAI@n — Settings</h2>

  <label>Host URL</label>
  <input id="apiBase" type="url" placeholder="https://your-app.vercel.app" />

  <label style="margin-top:8px; display:block;">API key (optional)</label>
  <input id="apiKey" type="text" placeholder="dev-extension-key" />

  <label style="margin-top:14px; display:flex; align-items:center; gap:8px;">
    <input id="liveOn" type="checkbox" />
    <span>Live suggestions while typing on AI sites</span>
  </label>

  <label style="margin-top:8px; display:flex; align-items:center; gap:8px;">
    <span>UI locale</span>
    <select id="locale">
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>
  </label>

  <button id="save" style="margin-top:14px;">Save</button>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
