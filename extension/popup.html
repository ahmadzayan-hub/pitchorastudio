<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Prompt Orchestrator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <strong>Prompt Orchestrator</strong>
    <a id="settings" href="options.html" target="_blank">Settings</a>
  </header>
  <textarea id="raw" placeholder="Paste your raw prompt here…" rows="6"></textarea>
  <div class="row">
    <select id="model">
      <option value="generic">Generic</option>
      <option value="chatgpt">ChatGPT</option>
      <option value="claude">Claude</option>
      <option value="copilot">Copilot</option>
      <option value="gemini">Gemini</option>
    </select>
    <button id="go">Enhance</button>
  </div>
  <pre id="out" hidden></pre>
  <button id="copy" hidden>Copy</button>
  <p id="err" class="err"></p>
  <script src="popup.js"></script>
</body>
</html>
